name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r airflow/requirements.txt
    
    - name: Run flake8 linting
      run: |
        flake8 airflow/dags --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 airflow/dags --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Initialize Airflow database
      run: |
        export AIRFLOW_HOME=${{ github.workspace }}/airflow
        export AIRFLOW__CORE__LOAD_EXAMPLES=False
        airflow db migrate
    
    - name: Run DAG import checks
      run: |
        export AIRFLOW_HOME=${{ github.workspace }}/airflow
        export AIRFLOW__CORE__LOAD_EXAMPLES=False
        python -c "
        from airflow.models import DagBag
        import sys
        dagbag = DagBag(dag_folder='airflow/dags', include_examples=False)
        print(f'✅ DAGs loaded: {len(dagbag.dags)}')
        if dagbag.import_errors:
            print(f'❌ Import errors found: {dagbag.import_errors}')
            sys.exit(1)
        else:
            print('✅ No import errors - all DAGs loaded successfully')
        "
    
    - name: Run pytest tests
      run: |
        export AIRFLOW_HOME=${{ github.workspace }}/airflow
        export AIRFLOW__CORE__LOAD_EXAMPLES=False
        pytest airflow/tests -v --tb=short
